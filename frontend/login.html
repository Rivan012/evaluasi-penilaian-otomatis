<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NEUROGRADE</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }
        .auth-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-top: 1rem;
            margin-bottom: 0.35rem;
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div style="text-align: center; margin-bottom: 1.75rem;">
            <div class="logo" style="font-size: 2rem;">NEURO<span>GRADE</span></div>
            <p style="color: var(--text-muted); font-size: 0.925rem; margin-top: 0.35rem;">
                Intelligent Tutoring System • Evaluasi Otomatis
            </p>
        </div>

        <section class="card">
            <div class="badge" id="auth-badge">PORTAL SISWA</div>
            <h2 id="auth-title" style="margin-bottom: 0.25rem; font-size: 1.4rem;">Masuk ke Akun</h2>
            <p id="auth-subtitle" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.25rem;">
                Masukkan username dan password yang sudah terdaftar.
            </p>

            <label class="auth-label" for="auth-username">Username</label>
            <input type="text" id="auth-username" placeholder="Masukkan username">

            <label class="auth-label" for="auth-password">Password</label>
            <input type="password" id="auth-password" placeholder="Masukkan password">

            <p id="auth-error" style="color: var(--status-danger); font-size: 0.85rem; margin-top: 0.75rem; display: none;"></p>

            <button id="btn-submit-auth" class="btn-primary" style="margin-top: 1.25rem;">Masuk ke Dashboard</button>
            
            <p style="text-align: center; margin-top: 1.25rem; font-size: 0.875rem; color: var(--text-muted);">
                <span id="toggle-text">Belum punya akun?</span>
                <a href="#" id="toggle-mode" style="color: var(--accent); font-weight: 600; text-decoration: none; margin-left: 4px;">
                    Daftar Akun Baru
                </a>
            </p>
        </section>
    </div>

    <script src="js/gamification.js"></script>
    <script>
        if (getCurrentUsername()) {
            window.location.href = "dashboard.html";
        }

        let isRegisterMode = false;

        const badge = document.getElementById("auth-badge");
        const title = document.getElementById("auth-title");
        const subtitle = document.getElementById("auth-subtitle");
        const submitBtn = document.getElementById("btn-submit-auth");
        const toggleText = document.getElementById("toggle-text");
        const toggleLink = document.getElementById("toggle-mode");
        const errorMsg = document.getElementById("auth-error");
        const passwordInput = document.getElementById("auth-password");

        toggleLink.addEventListener("click", (e) => {
            e.preventDefault();
            isRegisterMode = !isRegisterMode;
            errorMsg.style.display = "none";

            if (isRegisterMode) {
                badge.textContent = "PENDAFTARAN BARU";
                title.textContent = "Buat Akun Siswa";
                subtitle.textContent = "Daftarkan username baru untuk memulai evaluasi belajar.";
                submitBtn.textContent = "Daftar & Masuk";
                toggleText.textContent = "Sudah memiliki akun?";
                toggleLink.textContent = "Login di Sini";
            } else {
                badge.textContent = "PORTAL SISWA";
                title.textContent = "Masuk ke Akun";
                subtitle.textContent = "Masukkan username dan password yang sudah terdaftar.";
                submitBtn.textContent = "Masuk ke Dashboard";
                toggleText.textContent = "Belum punya akun?";
                toggleLink.textContent = "Daftar Akun Baru";
            }
        });

        async function handleAuth() {
            const username = document.getElementById("auth-username").value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                errorMsg.textContent = "Username dan password tidak boleh kosong.";
                errorMsg.style.display = "block";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Memproses...";
            errorMsg.style.display = "none";

            try {
                const res = isRegisterMode 
                    ? await registerUser(username, password)
                    : await loginUser(username, password);

                if (!res.success) {
                    errorMsg.textContent = res.message || "Gagal memproses autentikasi.";
                    errorMsg.style.display = "block";
                } else {
                    window.location.href = "dashboard.html";
                    return;
                }
            } catch (err) {
                errorMsg.textContent = "Gagal terhubung ke server.";
                errorMsg.style.display = "block";
            }

            submitBtn.disabled = false;
            submitBtn.textContent = isRegisterMode ? "Daftar & Masuk" : "Masuk ke Dashboard";
        }

        submitBtn.addEventListener("click", handleAuth);

        document.getElementById("auth-username").addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleAuth();
        });

        passwordInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleAuth();
        });
    </script>
</body>
</html>
