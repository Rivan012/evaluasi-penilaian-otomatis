<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - NEUROGRADE</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .btn-logout {
            margin-top: 1.5rem;
            padding: 0.65rem 1.5rem;
            border: 1px solid var(--status-danger);
            border-radius: var(--radius-md);
            background: transparent;
            color: var(--status-danger);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.15);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">NEURO<span>GRADE</span></div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="leaderboard.html">Leaderboard</a></li>
            <li><a href="index.html">Kuis</a></li>
            <li><a href="profile.html" class="active">Profil</a></li>
        </ul>
    </nav>

    <main class="container">
        <section class="card" style="text-align: center;">
            <div class="badge">AKUN SISWA AKTIF</div>
            <h2 id="profile-username" style="font-size: 1.75rem; letter-spacing: -0.01em;">-</h2>
            
            <div style="margin-top: 0.75rem;">
                <span id="stat-level" style="font-weight: 600; color: var(--accent); font-size: 1.1rem;">Level 1</span>
                <span style="color: var(--text-muted); margin: 0 0.5rem;">•</span>
                <span id="stat-xp" style="font-weight: 600; color: #C4B5FD;">0 XP</span>
            </div>

            <button id="btn-logout" class="btn-logout">Keluar (Logout)</button>
        </section>

        <section class="card">
            <h3 style="font-size: 1.15rem; margin-bottom: 0.5rem;">Lencana Pencapaian (Achievements)</h3>
            <div class="badge-grid">
                <div class="achievement-item" id="badge-first">
                    <svg class="achievement-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                    </svg>
                    <strong style="display: block; font-size: 0.95rem;">Langkah Awal</strong>
                    <small style="color: var(--text-muted); font-size: 0.8rem;">Menjawab 1 soal pertama</small>
                </div>
                <div class="achievement-item" id="badge-master">
                    <svg class="achievement-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <strong style="display: block; font-size: 0.95rem;">Akurasi Tinggi</strong>
                    <small style="color: var(--text-muted); font-size: 0.8rem;">3x skor Sangat Baik (≥80%)</small>
                </div>
                <div class="achievement-item" id="badge-levelup">
                    <svg class="achievement-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                        <path d="M4 22h16"></path>
                        <path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path>
                        <path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path>
                    </svg>
                    <strong style="display: block; font-size: 0.95rem;">Naik Tingkat</strong>
                    <small style="color: var(--text-muted); font-size: 0.8rem;">Mencapai minimal Level 2</small>
                </div>
            </div>
        </section>
    </main>

    <script src="js/gamification.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("profile-username").textContent = getCurrentUsername() || "-";
            document.getElementById("btn-logout").addEventListener("click", logoutUser);
        });
    </script>
</body>
</html>
